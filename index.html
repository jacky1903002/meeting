<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會議記錄與待辦事項分析管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            corporate: {
              navy: '#1F497D',
              darkNavy: '#16365C',
              lightNavy: '#2C5E9E',
              accent: '#3185FC',
              slateBg: '#F4F7FA',
              zebraEven: '#FFFFFF',
              zebraOdd: '#F0F4F8',
              gridLine: '#D0D7DE'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F4F7FA;
      color: #333333;
    }
    
    /* 企業斑馬紋與網格表格 */
    .corporate-table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      border: 1px solid #D0D7DE;
      border-radius: 6px;
      overflow: hidden;
    }
    .corporate-table th {
      background-color: #1F497D;
      color: #FFFFFF;
      font-weight: 600;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 2px solid #16365C;
      font-size: 0.875rem;
      white-space: nowrap;
    }
    .corporate-table td {
      padding: 10px 14px;
      border-bottom: 1px solid #E1E4E8;
      border-right: 1px solid #E1E4E8;
      font-size: 0.875rem;
      word-wrap: break-word;
      max-width: 280px;
    }
    .corporate-table td:last-child {
      border-right: none;
    }
    .corporate-table tbody tr:nth-child(even) {
      background-color: #FFFFFF;
    }
    .corporate-table tbody tr:nth-child(odd) {
      background-color: #F0F4F8;
    }
    .corporate-table tbody tr:hover {
      background-color: #E2EBF4;
      transition: background-color 0.15s ease-in-out;
    }

    /* 列印與 PDF 匯出優化 */
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: #FFF !important;
        color: #000 !important;
      }
      .card-box {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
      }
      .corporate-table {
        border: 1px solid #000 !important;
      }
      .corporate-table th {
        background-color: #1F497D !important;
        color: #FFF !important;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- 1. AUTH MODAL / LOGIN SCREEN -->
  <div id="authContainer" class="fixed inset-0 bg-slate-900 bg-opacity-75 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md border-t-8 border-corporate-navy">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-blue-50 text-corporate-navy rounded-full mb-3">
          <i class="fa-solid font-bold fa-handshake-angle text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-corporate-navy">會議管理與待辦分析系統</h2>
        <p class="text-gray-500 text-sm mt-1">請使用您的 Firebase 帳號密碼登入</p>
      </div>

      <div id="authError" class="hidden mb-4 p-3 bg-red-100 border border-red-300 text-red-700 text-sm rounded-md"></div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">電子郵件 (Email)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="email" id="loginEmail" required class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-corporate-navy text-sm" placeholder="name@company.com">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">密碼 (Password)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="loginPassword" required class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-corporate-navy text-sm" placeholder="••••••••">
          </div>
        </div>

        <button type="submit" id="btnLogin" class="w-full py-2.5 bg-corporate-navy hover:bg-corporate-darkNavy text-white font-medium rounded-md shadow transition duration-150 flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>登入系統</span>
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="mainApp" class="hidden flex-col flex-grow">
    
    <!-- HEADER BAR -->
    <header class="bg-corporate-navy text-white shadow-md sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="bg-white/10 p-2 rounded-lg">
            <i class="fa-solid fa-rectangle-list text-2xl text-blue-200"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight">會議記錄與待辦事項分析系統</h1>
            <p class="text-xs text-blue-200">Enterprise Meeting & Task Analytics System</p>
          </div>
        </div>

        <!-- Connection & Save Status Indicator -->
        <div class="flex items-center gap-6 text-xs bg-corporate-darkNavy/60 px-4 py-2 rounded-lg border border-white/10">
          <div class="flex items-center gap-2">
            <span class="font-medium text-gray-300">連線狀態:</span>
            <span id="connectionStatus" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full font-semibold bg-red-900/80 text-red-200">
              <span class="w-2 h-2 rounded-full bg-red-400 animate-pulse"></span> 🔴 離線
            </span>
          </div>

          <div class="flex items-center gap-2 border-l border-white/20 pl-4">
            <i class="fa-regular fa-clock text-blue-300"></i>
            <span class="text-gray-300">上次儲存:</span>
            <span id="lastSaveTime" class="font-mono text-blue-100">尚未更新</span>
          </div>

          <div class="border-l border-white/20 pl-4 flex items-center gap-2">
            <span id="userEmailBadge" class="text-gray-300 font-medium"></span>
            <button id="btnLogout" class="ml-2 px-2 py-1 bg-red-600/80 hover:bg-red-700 text-white rounded transition text-xs" title="登出">
              <i class="fa-solid fa-power-off"></i> 登出
            </button>
          </div>
        </div>
      </div>

      <!-- NAVBAR TABS -->
      <nav class="bg-corporate-darkNavy border-t border-white/10 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-1">
          <button id="tabBtn1" onclick="switchTab('meetings')" class="tab-btn active px-5 py-2.5 text-sm font-medium border-b-2 border-blue-400 text-white flex items-center gap-2 bg-white/10">
            <i class="fa-solid fa-users-rectangle"></i>
            <span>會議記錄管理</span>
          </button>
          <button id="tabBtn2" onclick="switchTab('tasks')" class="tab-btn px-5 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-300 hover:text-white hover:bg-white/5 flex items-center gap-2">
            <i class="fa-solid fa-list-check"></i>
            <span>待辦事項明細</span>
          </button>
          <button id="tabBtn3" onclick="switchTab('analytics')" class="tab-btn px-5 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-300 hover:text-white hover:bg-white/5 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie"></i>
            <span>統計分析 Dashboard</span>
          </button>
        </div>
      </nav>
    </header>

    <!-- CONTENT BODY -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">
      
      <!-- TAB 1: 會議記錄管理 -->
      <section id="tabMeetings" class="tab-content">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4 no-print">
          <div class="flex items-center gap-3">
            <div class="relative">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
              <input type="text" id="meetingSearch" oninput="renderMeetingsTable()" placeholder="搜尋主題、主持人..." class="pl-9 pr-4 py-1.5 border border-gray-300 rounded-md text-sm w-64 focus:ring-2 focus:ring-corporate-navy focus:outline-none">
            </div>
            <select id="meetingDeptFilter" onchange="renderMeetingsTable()" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none">
              <option value="">所有部門</option>
              <option value="製造">製造</option>
              <option value="生物管">生物管</option>
              <option value="工程">工程</option>
              <option value="採購">採購</option>
              <option value="總經理室">總經理室</option>
              <option value="人資">人資</option>
              <option value="資訊">資訊</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="exportToCSV('meetings')" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded text-sm font-medium transition flex items-center gap-1.5">
              <i class="fa-solid fa-file-excel"></i> 匯出 CSV
            </button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-gray-600 hover:bg-gray-700 text-white rounded text-sm font-medium transition flex items-center gap-1.5">
              <i class="fa-solid fa-print"></i> 列印 / PDF
            </button>
            <button onclick="openMeetingModal()" class="px-4 py-1.5 bg-corporate-navy hover:bg-corporate-darkNavy text-white rounded text-sm font-medium transition flex items-center gap-1.5 shadow">
              <i class="fa-solid fa-plus"></i> 新增會議記錄
            </button>
          </div>
        </div>

        <!-- Meeting Table -->
        <div class="bg-white rounded-lg shadow-sm overflow-x-auto border border-gray-200">
          <table class="corporate-table">
            <thead>
              <tr>
                <th style="width: 140px;">會議日期</th>
                <th>會議主題</th>
                <th style="width: 100px;">主辦部門</th>
                <th style="width: 110px;">會議類型</th>
                <th style="width: 160px;">與會人員</th>
                <th style="width: 100px;">主持人</th>
                <th>決議摘要</th>
                <th style="width: 100px;" class="text-center">紀錄狀態</th>
                <th style="width: 90px;" class="text-center no-print">操作</th>
              </tr>
            </thead>
            <tbody id="meetingsTableBody">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- TAB 2: 待辦事項明細 -->
      <section id="tabTasks" class="tab-content hidden">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4 no-print">
          <div class="flex items-center gap-3">
            <div class="relative">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
              <input type="text" id="taskSearch" oninput="renderTasksTable()" placeholder="搜尋描述、負責人..." class="pl-9 pr-4 py-1.5 border border-gray-300 rounded-md text-sm w-64 focus:ring-2 focus:ring-corporate-navy focus:outline-none">
            </div>
            <select id="taskStatusFilter" onchange="renderTasksTable()" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none">
              <option value="">所有狀態</option>
              <option value="未開始">未開始</option>
              <option value="進行中">進行中</option>
              <option value="已完成">已完成</option>
              <option value="OVERDUE">僅顯示逾期</option>
            </select>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="exportToCSV('tasks')" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded text-sm font-medium transition flex items-center gap-1.5">
              <i class="fa-solid fa-file-excel"></i> 匯出 CSV
            </button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-gray-600 hover:bg-gray-700 text-white rounded text-sm font-medium transition flex items-center gap-1.5">
              <i class="fa-solid fa-print"></i> 列印 / PDF
            </button>
            <button onclick="openTaskModal()" class="px-4 py-1.5 bg-corporate-navy hover:bg-corporate-darkNavy text-white rounded text-sm font-medium transition flex items-center gap-1.5 shadow">
              <i class="fa-solid fa-plus"></i> 新增待辦事項
            </button>
          </div>
        </div>

        <!-- Task Table -->
        <div class="bg-white rounded-lg shadow-sm overflow-x-auto border border-gray-200">
          <table class="corporate-table">
            <thead>
              <tr>
                <th style="width: 100px;">任務 ID</th>
                <th style="width: 110px;">關聯會議 ID</th>
                <th style="width: 100px;">負責部門</th>
                <th style="width: 100px;">執行負責人</th>
                <th>待辦事項描述</th>
                <th style="width: 110px;">預計完成日</th>
                <th style="width: 100px;" class="text-center">執行狀態</th>
                <th style="width: 100px;" class="text-center">逾期狀態</th>
                <th style="width: 90px;" class="text-center no-print">操作</th>
              </tr>
            </thead>
            <tbody id="tasksTableBody">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- TAB 3: 統計分析 DASHBOARD -->
      <section id="tabAnalytics" class="tab-content hidden space-y-6">
        
        <!-- KPI Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-white p-5 rounded-lg border-l-4 border-corporate-navy shadow-sm flex items-center justify-between">
            <div>
              <p class="text-xs font-semibold uppercase text-gray-500">會議總數</p>
              <h3 id="kpiTotalMeetings" class="text-2xl font-bold text-gray-800 mt-1">0</h3>
            </div>
            <div class="p-3 bg-blue-50 text-corporate-navy rounded-full">
              <i class="fa-solid fa-handshake text-xl"></i>
            </div>
          </div>

          <div class="bg-white p-5 rounded-lg border-l-4 border-indigo-600 shadow-sm flex items-center justify-between">
            <div>
              <p class="text-xs font-semibold uppercase text-gray-500">待辦任務總數</p>
              <h3 id="kpiTotalTasks" class="text-2xl font-bold text-gray-800 mt-1">0</h3>
            </div>
            <div class="p-3 bg-indigo-50 text-indigo-600 rounded-full">
              <i class="fa-solid fa-list-check text-xl"></i>
            </div>
          </div>

          <div class="bg-white p-5 rounded-lg border-l-4 border-emerald-600 shadow-sm flex items-center justify-between">
            <div>
              <p class="text-xs font-semibold uppercase text-gray-500">任務完成率</p>
              <h3 id="kpiCompletionRate" class="text-2xl font-bold text-emerald-700 mt-1">0.0%</h3>
            </div>
            <div class="p-3 bg-emerald-50 text-emerald-600 rounded-full">
              <i class="fa-solid fa-chart-line text-xl"></i>
            </div>
          </div>

          <div class="bg-white p-5 rounded-lg border-l-4 border-red-600 shadow-sm flex items-center justify-between">
            <div>
              <p class="text-xs font-semibold uppercase text-gray-500">逾期任務數</p>
              <h3 id="kpiOverdueTasks" class="text-2xl font-bold text-red-600 mt-1">0</h3>
            </div>
            <div class="p-3 bg-red-50 text-red-600 rounded-full">
              <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            </div>
          </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
            <h4 class="text-base font-bold text-corporate-navy mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
              <i class="fa-solid fa-chart-pie text-blue-600"></i> 任務執行狀態分布
            </h4>
            <div class="relative h-64 flex justify-center">
              <canvas id="chartTaskStatus"></canvas>
            </div>
          </div>

          <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
            <h4 class="text-base font-bold text-corporate-navy mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
              <i class="fa-solid fa-chart-column text-blue-600"></i> 各部門會議與任務數量統計
            </h4>
            <div class="relative h-64">
              <canvas id="chartDeptDistribution"></canvas>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- MODAL: Meeting Form -->
  <div id="meetingModal" class="fixed inset-0 bg-gray-900 bg-opacity-60 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl overflow-hidden border-t-4 border-corporate-navy">
      <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex items-center justify-between">
        <h3 id="meetingModalTitle" class="text-lg font-bold text-corporate-navy">新增會議記錄</h3>
        <button onclick="closeMeetingModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      
      <form id="meetingForm" onsubmit="saveMeeting(event)" class="p-6 space-y-4">
        <input type="hidden" id="mIdKey">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">會議日期與時間 *</label>
            <input type="datetime-local" id="mDateTime" required class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">會議類型</label>
            <input type="text" id="mType" placeholder="如：例行週會" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">會議主題 *</label>
          <input type="text" id="mTopic" required placeholder="請輸入會議主題" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">主辦部門 *</label>
            <select id="mDept" required class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none">
              <option value="製造">製造</option>
              <option value="生物管">生物管</option>
              <option value="工程">工程</option>
              <option value="採購">採購</option>
              <option value="總經理室">總經理室</option>
              <option value="人資">人資</option>
              <option value="資訊">資訊</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">主持人</label>
            <input type="text" id="mChair" placeholder="主持人姓名" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">與會人員</label>
          <input type="text" id="mAttendees" placeholder="例：張經理、李組長、王專員" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">紀錄狀態 *</label>
          <select id="mStatus" required class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none">
            <option value="進行中">進行中</option>
            <option value="已結案">已結案</option>
            <option value="草稿">草稿</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">決議摘要</label>
          <textarea id="mSummary" rows="3" placeholder="請輸入重要決議事項..." class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-corporate-navy focus:outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-gray-100">
          <button type="button" onclick="closeMeetingModal()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded text-sm hover:bg-gray-100">取消</button>
          <button type="submit" class="px-5 py-2 bg-corporate-navy hover:bg-corporate-darkNavy text-white rounded text-sm font-medium shadow">儲存記錄</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Task Form -->
  <div id="taskModal" class="fixed inset-0 bg-gray-900 bg-opacity-60 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl overflow-hidden border-t-4 border-corporate-navy">

  <!-- FIREBASE MODULAR SDKS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      push, 
      onValue, 
      remove, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAU4GVuWXtg2IR3jsArRIhbY88M0iW2ns4",
      authDomain: "meeting-76193.firebaseapp.com",
      projectId: "meeting-76193",
      storageBucket: "meeting-76193.firebasestorage.app",
      messagingSenderId: "367173036964",
      appId: "1:367173036964:web:f234890eb4b12e05312f31",
      measurementId: "G-KSCVLNNZYV"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Global App State
    window.appState = {
      user: null,
      meetings: {},
      tasks: {},
      statusChart: null,
      deptChart: null
    };

    // --- AUTHENTICATION LISTENERS ---
    const authContainer = document.getElementById('authContainer');
    const mainApp = document.getElementById('mainApp');
    const authError = document.getElementById('authError');
    const loginForm = document.getElementById('loginForm');
    const userEmailBadge = document.getElementById('userEmailBadge');
    const btnLogout = document.getElementById('btnLogout');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        authError.textContent = "登入失敗: " + (err.message || "請檢查帳號密碼");
        authError.classList.remove('hidden');
      }
    });

    btnLogout.addEventListener('click', () => {
      signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.appState.user = user;
        userEmailBadge.textContent = user.email;
        authContainer.classList.add('hidden');
        mainApp.classList.remove('hidden');
        mainApp.classList.add('flex');
        
        // Start Firebase Listeners
        initFirebaseListeners();
      } else {
        window.appState.user = null;
        authContainer.classList.remove('hidden');
        mainApp.classList.add('hidden');
        mainApp.classList.remove('flex');
      }
    });

    // --- FIREBASE REALTIME LISTENERS ---
    function initFirebaseListeners() {
      // 1. Connection state monitoring (.info/connected)
      const connectedRef = ref(db, ".info/connected");
      onValue(connectedRef, (snap) => {
        const connEl = document.getElementById('connectionStatus');
        if (snap.val() === true) {
          connEl.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full font-semibold bg-emerald-900/80 text-emerald-200";
          connEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> 🟢 已連線`;
        } else {
          connEl.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full font-semibold bg-red-900/80 text-red-200";
          connEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400 animate-pulse"></span> 🔴 離線`;
        }
      });

      // 2. Sync Meetings Data
      const meetingsRef = ref(db, 'meetings');
      onValue(meetingsRef, (snapshot) => {
        window.appState.meetings = snapshot.val() || {};
        updateSaveTimestamp();
        window.renderMeetingsTable();
        window.populateRefMeetingOptions();
        window.updateDashboard();
      });

      // 3. Sync Tasks Data
      const tasksRef = ref(db, 'tasks');
      onValue(tasksRef, (snapshot) => {
        window.appState.tasks = snapshot.val() || {};
        updateSaveTimestamp();
        window.renderTasksTable();
        window.updateDashboard();
      });
    }

    function updateSaveTimestamp() {
      const now = new Date();
      const formatted = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      document.getElementById('lastSaveTime').textContent = formatted;
    }

    // --- DB ACTIONS ---
    window.dbSaveMeeting = async (key, data) => {
      const path = key ? `meetings/${key}` : 'meetings';
      if (key) {
        await set(ref(db, path), { ...data, updatedAt: serverTimestamp() });
      } else {
        const newRef = push(ref(db, 'meetings'));
        await set(newRef, { ...data, createdAt: serverTimestamp() });
      }
    };

    window.dbDeleteMeeting = async (key) => {
      if (confirm('確定要刪除此筆會議記錄嗎？')) {
        await remove(ref(db, `meetings/${key}`));
      }
    };

    window.dbSaveTask = async (key, data) => {
      const path = key ? `tasks/${key}` : 'tasks';
      if (key) {
        await set(ref(db, path), { ...data, updatedAt: serverTimestamp() });
      } else {
        const newRef = push(ref(db, 'tasks'));
        await set(newRef, { ...data, createdAt: serverTimestamp() });
      }
    };

    window.dbDeleteTask = async (key) => {
      if (confirm('確定要刪除此待辦事項嗎？')) {
        await remove(ref(db, `tasks/${key}`));
      }
    };
  </script>

  <!-- APP LOGIC & UI RENDERING -->
  <script>

      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active', 'border-blue-400', 'text-white', 'bg-white/10');
        btn.classList.add('border-transparent', 'text-gray-300');

      if (tabName === 'meetings') {
        document.getElementById('tabMeetings').classList.remove('hidden');
        document.getElementById('tabBtn1').classList.add('active', 'border-blue-400', 'text-white', 'bg-white/10');

        document.getElementById('tabTasks').classList.remove('hidden');
        document.getElementById('tabBtn2').classList.add('active', 'border-blue-400', 'text-white', 'bg-white/10');
      } else if (tabName === 'analytics') {
        document.getElementById('tabAnalytics').classList.remove('hidden');
        document.getElementById('tabBtn3').classList.add('active', 'border-blue-400', 'text-white', 'bg-white/10');
        updateDashboard();
      }
    }

    // --- RENDER MEETINGS ---
    function renderMeetingsTable() {
      const tbody = document.getElementById('meetingsTableBody');
      const search = (document.getElementById('meetingSearch').value || '').toLowerCase();

      const keys = Object.keys(meetingsObj);

      if (keys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-gray-400">目前尚無會議記錄資料</td></tr>`;
        return;
      }

      let html = '';
      keys.forEach(key => {
        const item = meetingsObj[key];
        
        // Filters
        if (deptFilter && item.dept !== deptFilter) return;

            <td>${escapeHtml(item.type || '')}</td>
            <td class="text-xs text-gray-700">${escapeHtml(item.attendees || '-')}</td>
            <td>${escapeHtml(item.chair || '')}</td>
            <td class="text-gray-600">${escapeHtml(item.summary || '')}</td>
            <td class="text-center">
              <span class="px-2.5 py-1 text-xs rounded-full font-medium ${statusBadge}">${escapeHtml(item.status || '')}</span>
            </td>
            <td class="text-center no-print whitespace-nowrap">
              <button onclick="editMeeting('${key}')" class="text-blue-600 hover:text-blue-800 mr-2" title="編輯"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="window.dbDeleteMeeting('${key}')" class="text-red-600 hover:text-red-800" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html || `<tr><td colspan="9" class="text-center py-6 text-gray-400">無符合條件的會議資料</td></tr>`;
    }

      let html = '';
      keys.forEach(key => {
        const item = meetingsObj[key];
        
        // Filters
        if (deptFilter && item.dept !== deptFilter) return;
        if (search) {
          const text = (item.topic + item.chair + item.summary + item.meetingId).toLowerCase();
          if (!text.includes(search)) return;
        }

        // Format Date
        const dateStr = item.dateTime ? item.dateTime.replace('T', ' ') : '-';

        // Badge Class
        let statusBadge = 'bg-gray-100 text-gray-700';
        if (item.status === '已結案') statusBadge = 'bg-emerald-100 text-emerald-800 border border-emerald-300';
        else if (item.status === '進行中') statusBadge = 'bg-blue-100 text-blue-800 border border-blue-300';
        else if (item.status === '草稿') statusBadge = 'bg-amber-100 text-amber-800 border border-amber-300';

        html += `
          <tr>
            <td class="font-mono text-xs font-bold text-corporate-navy">${escapeHtml(item.meetingId || key)}</td>
            <td class="whitespace-nowrap text-xs">${escapeHtml(dateStr)}</td>
            <td class="font-medium text-gray-900">${escapeHtml(item.topic || '')}</td>
            <td><span class="inline-block px-2 py-0.5 text-xs bg-slate-200 rounded text-slate-800">${escapeHtml(item.dept || '')}</span></td>
            <td>${escapeHtml(item.type || '')}</td>
            <td class="text-center font-mono">${item.attendees || 0}</td>
            <td>${escapeHtml(item.chair || '')}</td>
            <td class="text-gray-600">${escapeHtml(item.summary || '')}</td>
            <td class="text-center">
              <span class="px-2.5 py-1 text-xs rounded-full font-medium ${statusBadge}">${escapeHtml(item.status || '')}</span>
            </td>

    // --- RENDER TASKS ---
    function renderTasksTable() {
      const tbody = document.getElementById('tasksTableBody');
      const search = (document.getElementById('taskSearch').value || '').toLowerCase();
      const statusFilter = document.getElementById('taskStatusFilter').value;

      const tasksObj = window.appState.tasks || {};
      const keys = Object.keys(tasksObj);

      if (keys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-gray-400">目前尚無待辦事項資料</td></tr>`;
        return;
      }

      const todayStr = new Date().toISOString().split('T')[0];
      let html = '';

      keys.forEach(key => {
        const item = tasksObj[key];

        // Overdue logic: 非「已完成」且 當前日期已超過預計完成日
        const isOverdue = (item.status !== '已完成') && (item.dueDate && item.dueDate < todayStr);

        // Filter logic
        if (statusFilter === 'OVERDUE' && !isOverdue) return;
        if (statusFilter && statusFilter !== 'OVERDUE' && item.status !== statusFilter) return;
        if (search) {
          const text = (item.desc + item.owner + item.taskId + item.refMeetingId).toLowerCase();
          if (!text.includes(search)) return;
        }

        let statusClass = 'bg-gray-100 text-gray-700';
        if (item.status === '已完成') statusClass = 'bg-emerald-100 text-emerald-800 border border-emerald-300';
        else if (item.status === '進行中') statusClass = 'bg-blue-100 text-blue-800 border border-blue-300';

        let overdueBadge = isOverdue 
          ? `<span class="px-2 py-0.5 text-xs rounded font-bold bg-red-100 text-red-700 border border-red-300 animate-pulse"><i class="fa-solid fa-circle-exclamation"></i> 已逾期</span>`
          : `<span class="px-2 py-0.5 text-xs rounded text-gray-500">正常</span>`;

        html += `
          <tr>
            <td class="font-mono text-xs font-bold text-corporate-navy">${escapeHtml(item.taskId || key)}</td>
            <td class="font-mono text-xs text-blue-700">${escapeHtml(item.refMeetingId || '')}</td>
            <td><span class="inline-block px-2 py-0.5 text-xs bg-slate-200 rounded text-slate-800">${escapeHtml(item.dept || '')}</span></td>
            <td class="font-medium text-gray-800">${escapeHtml(item.owner || '')}</td>
            <td class="text-gray-800">${escapeHtml(item.desc || '')}</td>
            <td class="font-mono text-xs">${escapeHtml(item.dueDate || '')}</td>
            <td class="text-center">
              <span class="px-2.5 py-1 text-xs rounded-full font-medium ${statusClass}">${escapeHtml(item.status || '')}</span>
            </td>
            <td class="text-center">${overdueBadge}</td>
            <td class="text-center no-print whitespace-nowrap">
              <button onclick="editTask('${key}')" class="text-blue-600 hover:text-blue-800 mr-2" title="編輯"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="window.dbDeleteTask('${key}')" class="text-red-600 hover:text-red-800" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html || `<tr><td colspan="9" class="text-center py-6 text-gray-400">無符合條件的待辦事項</td></tr>`;
    }

    // --- MODAL HANDLERS FOR MEETINGS ---
    function openMeetingModal() {
      document.getElementById('meetingForm').reset();
      document.getElementById('mIdKey').value = '';
      document.getElementById('meetingModalTitle').textContent = '新增會議記錄';
      
      // Default datetime
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('mDateTime').value = now.toISOString().slice(0, 16);

      document.getElementById('meetingModal').classList.remove('hidden');
      document.getElementById('meetingModal').classList.add('flex');
    }

    function editMeeting(key) {
      const item = window.appState.meetings[key];
      if (!item) return;

      document.getElementById('mIdKey').value = key;
      document.getElementById('mDateTime').value = item.dateTime || '';
      document.getElementById('mTopic').value = item.topic || '';
      document.getElementById('mDept').value = item.dept || '製造';
      document.getElementById('mType').value = item.type || '';
      document.getElementById('mAttendees').value = item.attendees || '';
      document.getElementById('mChair').value = item.chair || '';
      document.getElementById('mStatus').value = item.status || '進行中';
      document.getElementById('mSummary').value = item.summary || '';

      document.getElementById('meetingModalTitle').textContent = '編輯會議記錄';
      document.getElementById('meetingModal').classList.remove('hidden');
      document.getElementById('meetingModal').classList.add('flex');
    }

    async function saveMeeting(e) {
      e.preventDefault();
      const key = document.getElementById('mIdKey').value;
      const data = {
        dateTime: document.getElementById('mDateTime').value,
        topic: document.getElementById('mTopic').value,
        dept: document.getElementById('mDept').value,
        type: document.getElementById('mType').value,
        attendees: document.getElementById('mAttendees').value,
        chair: document.getElementById('mChair').value,
        status: document.getElementById('mStatus').value,
        summary: document.getElementById('mSummary').value
      };

      await window.dbSaveMeeting(key, data);
      closeMeetingModal();
    }

    // --- MODAL HANDLERS FOR TASKS ---
    function openTaskModal() {
      document.getElementById('taskForm').reset();
      document.getElementById('tIdKey').value = '';
      document.getElementById('taskModalTitle').textContent = '新增待辦事項';
      document.getElementById('tId').value = 'TSK-' + Date.now().toString().slice(-6);
      
      // Default date to next week
      const nextWeek = new Date();
      nextWeek.setDate(nextWeek.getDate() + 7);
      document.getElementById('tDueDate').value = nextWeek.toISOString().split('T')[0];

      populateRefMeetingOptions();

      document.getElementById('taskModal').classList.remove('hidden');
      document.getElementById('taskModal').classList.add('flex');
    }

    function closeTaskModal() {
      document.getElementById('taskModal').classList.add('hidden');
      document.getElementById('taskModal').classList.remove('flex');
    }

    function populateRefMeetingOptions() {
      const select = document.getElementById('tRefMeetingId');
      const meetingsObj = window.appState.meetings || {};
      const keys = Object.keys(meetingsObj);

      let opts = '<option value="">-- 請選擇關聯會議 --</option>';
      keys.forEach(k => {
        const m = meetingsObj[k];
        const displayId = m.meetingId || k;
        opts += `<option value="${escapeHtml(displayId)}">${escapeHtml(displayId)} - ${escapeHtml(m.topic)}</option>`;
      });
      select.innerHTML = opts;
    }

    function editTask(key) {
      const item = window.appState.tasks[key];
      if (!item) return;

      populateRefMeetingOptions();

      document.getElementById('tIdKey').value = key;
      document.getElementById('tId').value = item.taskId || key;
      document.getElementById('tRefMeetingId').value = item.refMeetingId || '';
      document.getElementById('tDept').value = item.dept || '製造';
      document.getElementById('tOwner').value = item.owner || '';
      document.getElementById('tDesc').value = item.desc || '';
      document.getElementById('tDueDate').value = item.dueDate || '';
      document.getElementById('tStatus').value = item.status || '未開始';

      document.getElementById('taskModalTitle').textContent = '編輯待辦事項';
      document.getElementById('taskModal').classList.remove('hidden');
      document.getElementById('taskModal').classList.add('flex');
    }

    async function saveTask(e) {
      e.preventDefault();
      const key = document.getElementById('tIdKey').value;
      const data = {
        taskId: document.getElementById('tId').value,
        refMeetingId: document.getElementById('tRefMeetingId').value,
        dept: document.getElementById('tDept').value,
        owner: document.getElementById('tOwner').value,
        desc: document.getElementById('tDesc').value,
        dueDate: document.getElementById('tDueDate').value,
        status: document.getElementById('tStatus').value
      };

      await window.dbSaveTask(key, data);
      closeTaskModal();
    }

    // --- DASHBOARD & CHARTS ---
    function updateDashboard() {
      const meetings = window.appState.meetings || {};
      const tasks = window.appState.tasks || {};

      const meetingKeys = Object.keys(meetings);
      const taskKeys = Object.keys(tasks);

      const totalMeetings = meetingKeys.length;
      const totalTasks = taskKeys.length;

      let completedTasks = 0;
      let overdueTasks = 0;
      const todayStr = new Date().toISOString().split('T')[0];

      // Status breakdown
      const statusCounts = { '未開始': 0, '進行中': 0, '已完成': 0 };

      // Department breakdown
      const depts = ['製造', '生物管', '工程', '採購', '總經理室', '人資', '資訊', '其他'];
      const deptMeetings = {};
      const deptTasks = {};
      depts.forEach(d => { deptMeetings[d] = 0; deptTasks[d] = 0; });

      meetingKeys.forEach(k => {
        const m = meetings[k];
        if (deptMeetings[m.dept] !== undefined) deptMeetings[m.dept]++;
      });

      taskKeys.forEach(k => {
        const t = tasks[k];
        if (statusCounts[t.status] !== undefined) statusCounts[t.status]++;
        if (t.status === '已完成') completedTasks++;
        
        // Check overdue
        if (t.status !== '已完成' && t.dueDate && t.dueDate < todayStr) {
          overdueTasks++;
        }

        if (deptTasks[t.dept] !== undefined) deptTasks[t.dept]++;
      });

      const completionRate = totalTasks > 0 ? ((completedTasks / totalTasks) * 100).toFixed(1) : '0.0';

      // Update KPI
      document.getElementById('kpiTotalMeetings').textContent = totalMeetings.toLocaleString();
      document.getElementById('kpiTotalTasks').textContent = totalTasks.toLocaleString();
      document.getElementById('kpiCompletionRate').textContent = completionRate + '%';
      document.getElementById('kpiOverdueTasks').textContent = overdueTasks.toLocaleString();

      // Render Chart 1: Task Status Pie Chart
      const ctx1 = document.getElementById('chartTaskStatus').getContext('2d');
      if (window.appState.statusChart) window.appState.statusChart.destroy();

      window.appState.statusChart = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: ['未開始', '進行中', '已完成'],
          datasets: [{
            data: [statusCounts['未開始'], statusCounts['進行中'], statusCounts['已完成']],
            backgroundColor: ['#94A3B8', '#3B82F6', '#10B981']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });

      // Render Chart 2: Dept Bar Chart
      const ctx2 = document.getElementById('chartDeptDistribution').getContext('2d');
      if (window.appState.deptChart) window.appState.deptChart.destroy();

      window.appState.deptChart = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: depts,
          datasets: [
            {
              label: '會議次數',
              data: depts.map(d => deptMeetings[d]),
              backgroundColor: '#1F497D'
            },
            {
              label: '待辦任務數',
              data: depts.map(d => deptTasks[d]),
              backgroundColor: '#6366F1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, ticks: { stepSize: 1 } }
          },
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    // --- CSV EXPORT FUNCTION ---
    function exportToCSV(type) {
      let csvContent = "\uFEFF"; // UTF-8 BOM
      
      if (type === 'meetings') {
        csvContent += "會議日期,會議主題,主辦部門,會議類型,與會人員,主持人,決議摘要,紀錄狀態\n";
        const meetingsObj = window.appState.meetings || {};
        Object.keys(meetingsObj).forEach(k => {
          const m = meetingsObj[k];
          const row = [
            m.dateTime || '',
            `"${(m.topic || '').replace(/"/g, '""')}"`,
            m.dept || '',
            m.type || '',
            `"${(m.attendees || '').replace(/"/g, '""')}"`,
            m.chair || '',
            `"${(m.summary || '').replace(/"/g, '""')}"`,
            m.status || ''
          ];
          csvContent += row.join(",") + "\n";
        });
      } else {
        csvContent += "任務ID,關聯會議ID,負責部門,執行負責人,待辦事項描述,預計完成日,執行狀態,逾期狀態\n";
        const tasksObj = window.appState.tasks || {};
        const todayStr = new Date().toISOString().split('T')[0];
        Object.keys(tasksObj).forEach(k => {
          const t = tasksObj[k];
          const isOverdue = (t.status !== '已完成') && (t.dueDate && t.dueDate < todayStr);
          const row = [
            t.taskId || k,
            t.refMeetingId || '',
            t.dept || '',
            t.owner || '',
            `"${(t.desc || '').replace(/"/g, '""')}"`,
            t.dueDate || '',
            t.status || '',
            isOverdue ? '已逾期' : '正常'
          ];
          csvContent += row.join(",") + "\n";
        });
      }

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", `${type}_export_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // --- UTILS ---
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
